[project]
name = "braid-demo"
version = "0.1.0"
description = "Public research-preview demo for Braid, a tokenizer-free byte-level hourglass language model."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# NOTE: the real model runtime (`braid-runtime`, which provides `idklm`) is NOT
# declared here. It is built from the private `idk-lm` repository and is not on
# any public index, so declaring it would make this public project unresolvable.
# Install it explicitly when you want the runtime backend:
#   uv pip install wheels/braid_runtime-0.1.0-py3-none-any.whl
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends(...) in defaults is the documented idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
